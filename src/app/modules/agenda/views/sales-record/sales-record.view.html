<p-panel>
  <ng-template #header>
    <div class="flex items-center justify-between w-full gap-2">
      <h3 class="text-lg font-semibold m-0">Registro de Ventas</h3>
      <p-button severity="secondary" [outlined]="true" [rounded]="true" (onClick)="loadOrders()"
        pTooltip="Actualizar" tooltipPosition="left">
        <ng-template #icon>
          <span class="material-symbols-outlined">refresh</span>
        </ng-template>
      </p-button>
    </div>
  </ng-template>

  <p-table [value]="orders()" [loading]="loading()" [paginator]="true" [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true"
    currentPageReportTemplate="{first} - {last} de {totalRecords}" styleClass="p-datatable-sm">
    <ng-template #header>
      <tr>
        <th>Consecutivo</th>
        <th>Cliente</th>
        <th>Total</th>
        <th>Fecha</th>
      </tr>
    </ng-template>
    <ng-template #body let-order>
      <tr class="cursor-pointer" (click)="onRowClick(order)">
        <td>{{ order.consecutive }}</td>
        <td>{{ order.customerNames }} {{ order.customerSurnames }}</td>
        <td>{{ order.price | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</td>
        <td>{{ order.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4" class="text-center text-surface-500 py-6">No hay ventas registradas</td>
      </tr>
    </ng-template>
  </p-table>
</p-panel>
