<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <label class="font-medium">Profesional</label>
    <p-autocomplete
      [(ngModel)]="selectedProfessional"
      [suggestions]="professionalSuggestions"
      (completeMethod)="searchProfessionals($event)"
      (onSelect)="onProfessionalSelect()"
      optionLabel="displayName"
      [forceSelection]="true"
      placeholder="Filtrar por profesional..."
      class="w-80"
    >
      <ng-template #option let-person>
        <div class="flex flex-col">
          <span class="font-medium">{{ person.displayName }}</span>
          <small class="text-surface-500">{{ person.identification }}</small>
        </div>
      </ng-template>
    </p-autocomplete>
    @if (selectedProfessional) {
      <p-button
        label="Ver todos"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="onClearFilter()"
      />
    }
    @if (loading()) {
      <span class="text-sm text-gray-500">Cargando...</span>
    }
  </div>

  <full-calendar [options]="calendarOptions()" />
</div>
