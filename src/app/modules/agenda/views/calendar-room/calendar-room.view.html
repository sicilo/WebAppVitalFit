<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <label class="font-medium">Sala</label>
    <p-autocomplete
      [(ngModel)]="selectedRoom"
      [suggestions]="roomSuggestions"
      (completeMethod)="searchRooms($event)"
      (onSelect)="onRoomSelect()"
      optionLabel="name"
      [forceSelection]="true"
      placeholder="Filtrar por sala..."
      class="w-80"
    >
      <ng-template #option let-room>
        <div class="flex flex-col">
          <span class="font-medium">{{ room.name }}</span>
          <small class="text-surface-500">{{ room.roomTypeName }}</small>
        </div>
      </ng-template>
    </p-autocomplete>
    @if (selectedRoom) {
      <p-button
        label="Ver todas"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="onClearFilter()"
      />
    }
    @if (loading()) {
      <span class="text-sm text-gray-500">Cargando...</span>
    }
  </div>

  <full-calendar [options]="calendarOptions()" />
</div>
