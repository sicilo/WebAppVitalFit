<div class="flex flex-col gap-4">
  <div class="flex items-center gap-4">
    <label class="font-medium">Cabinas</label>
    <p-multiselect
      [(ngModel)]="selectedRooms"
      [options]="allRooms"
      optionLabel="name"
      placeholder="Seleccionar cabinas..."
      [showClear]="true"
      [filter]="true"
      filterPlaceholder="Buscar cabina..."
      class="w-96"
      (onChange)="onRoomSelectionChange()"
      (onClear)="onRoomClear()"
    >
      <ng-template #item let-room>
        <div class="flex flex-col">
          <span class="font-medium">{{ room.name }}</span>
          <small class="text-surface-500">{{ room.roomTypeName }}</small>
        </div>
      </ng-template>
    </p-multiselect>
    @if (showCalendar()) {
      <p-button
        [rounded]="true"
        [text]="true"
        severity="secondary"
        pTooltip="Recargar citas"
        tooltipPosition="right"
        [loading]="loading()"
        (onClick)="reloadAppointments()"
      >
        <span class="material-symbols-outlined" style="font-size: 1.25rem;">refresh</span>
      </p-button>
    } @else if (loading()) {
      <span class="text-sm text-gray-500">Cargando...</span>
    }
  </div>

  @if (showCalendar()) {
    <full-calendar [options]="calendarOptions()" />
  } @else {
    <div class="flex items-center justify-center h-64 text-gray-400 text-sm">
      Selecciona al menos una cabina para ver el calendario.
    </div>
  }
</div>
