<div class="flex flex-col gap-4">
  <div class="flex flex-wrap items-center gap-4">
    <label class="font-medium">Profesional</label>
    <p-autocomplete
      [(ngModel)]="selectedProfessional"
      [suggestions]="professionalSuggestions"
      (completeMethod)="searchProfessionals($event)"
      (onSelect)="onProfessionalSelect()"
      (onClear)="onProfessionalClear()"
      optionLabel="displayName"
      [forceSelection]="true"
      placeholder="Buscar profesional por nombre..."
      class="w-80"
    >
      <ng-template #option let-person>
        <div class="flex flex-col">
          <span class="font-medium">{{ person.displayName }}</span>
          <small class="text-surface-500">{{ person.identification }}</small>
        </div>
      </ng-template>
    </p-autocomplete>

    <label class="font-medium">Cliente</label>
    <p-autocomplete
      [(ngModel)]="selectedClient"
      [suggestions]="clientSuggestions"
      (completeMethod)="searchClients($event)"
      (onSelect)="onClientSelect()"
      (onClear)="onClientClear()"
      optionLabel="displayName"
      [forceSelection]="true"
      placeholder="Buscar cliente por nombre..."
      class="w-80"
    >
      <ng-template #option let-person>
        <div class="flex flex-col">
          <span class="font-medium">{{ person.displayName }}</span>
          <small class="text-surface-500">{{ person.identification }}</small>
        </div>
      </ng-template>
    </p-autocomplete>

    @if (loading()) {
      <span class="text-sm text-gray-500">Cargando citas...</span>
    }
  </div>

  <full-calendar [options]="calendarOptions()" />
</div>
