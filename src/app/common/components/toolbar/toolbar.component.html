<p-toolbar class=" border-none bg-transparent">
  <ng-template #start>
    <section class="flex gap-4 items-center">
      <img src="assets/img/vital_fit_logo_small.svg" alt="VitalFit Logo" class="h-10 mx-auto" />
      <h1 class="text-xl font-semibold m-0">{{ titleService.title() }}</h1>
    </section>
  </ng-template>

  <ng-template #end>
    <div class="flex items-center gap-2">
      <p-button [rounded]="true" [text]="true" severity="secondary" (click)="toggleTheme()"
        [pTooltip]="themeService.isDarkMode() ? 'Light mode' : 'Dark mode'">
        <span class="material-symbols-outlined">
          {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
        </span>
      </p-button>

      @if (authService.userInfo(); as user) {
        <div class="flex flex-col text-right mr-2">
          <span class="font-semibold text-sm">{{ user.userName }}</span>
          <span class="text-xs text-surface-500">{{ user.roleName }}</span>
        </div>
      }

      <p-button [rounded]="true" [text]="true" severity="secondary" (click)="logout()" pTooltip="Cerrar sesión">
        <span class="material-symbols-outlined">logout</span>
      </p-button>
    </div>
  </ng-template>
</p-toolbar>
