<div class="role-list-container">
  <div class="page-header">
    <h1>Gestión de Roles</h1>
    <button mat-raised-button color="primary" (click)="createRole()">
      <mat-icon>add</mat-icon> Nuevo Rol
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando roles...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Roles Table -->
  <div class="table-container" *ngIf="!isLoading && roles.length > 0">
    <table mat-table [dataSource]="roles" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let role">{{ role.name }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let role">
          <button mat-icon-button color="primary" (click)="editRole(role)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="accent" (click)="managePermissions(role)" matTooltip="Permisos">
            <mat-icon>security</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(role)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && roles.length === 0 && !errorMessage">
    <mat-icon class="empty-icon">supervised_user_circle</mat-icon>
    <p>No hay roles registrados</p>
    <button mat-raised-button color="primary" (click)="createRole()">
      Crear primer rol
    </button>
  </div>
</div>
