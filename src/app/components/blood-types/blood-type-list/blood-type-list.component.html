<div class="blood-type-list-container">
  <div class="page-header">
    <h1>Tipos de Sangre</h1>
    <button mat-raised-button color="primary" (click)="createBloodType()">
      <mat-icon>add</mat-icon> Nuevo Tipo de Sangre
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando tipos de sangre...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Blood Types Table -->
  <div class="table-container" *ngIf="!isLoading && bloodTypes.length > 0">
    <table mat-table [dataSource]="bloodTypes" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let bloodType">{{ bloodType.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let bloodType">
          {{ bloodType.description || '-' }}
        </td>
      </ng-container>

      <!-- Created At Column -->
      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Fecha de Creación</th>
        <td mat-cell *matCellDef="let bloodType">
          {{ formatDate(bloodType.createdAt) }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let bloodType">
          <button mat-icon-button color="primary" (click)="editBloodType(bloodType)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(bloodType)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && bloodTypes.length === 0 && !errorMessage">
    <mat-icon>water_drop</mat-icon>
    <h3>No hay tipos de sangre registrados</h3>
    <button mat-raised-button color="primary" (click)="createBloodType()">
      Crear primer tipo de sangre
    </button>
  </div>
</div>
