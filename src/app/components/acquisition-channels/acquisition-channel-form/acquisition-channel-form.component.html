<h2 mat-dialog-title>{{ isEditMode ? 'Editar Canal de Adquisición' : 'Crear Canal de Adquisición' }}</h2>
<mat-dialog-content>
  <form [formGroup]="channelForm" class="acquisition-channel-dialog-form">
    <mat-form-field>
      <mat-label>Nombre del Canal</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Instagram Principal, Referidos VIP">
      <mat-error *ngIf="channelForm.get('name')?.hasError('required')">
        El nombre del canal es requerido
      </mat-error>
      <mat-error *ngIf="channelForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tipo de Canal</mat-label>
      <mat-select formControlName="type" placeholder="Selecciona un tipo">
        <mat-option *ngFor="let type of channelTypes" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="channelForm.get('type')?.hasError('required')">
        El tipo de canal es requerido
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Describe el canal de adquisición" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="channelForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
