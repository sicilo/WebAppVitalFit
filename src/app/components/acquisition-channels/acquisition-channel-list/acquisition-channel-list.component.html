<div class="acquisition-channel-list-container">
  <div class="page-header">
    <h1>Canales de Adquisición</h1>
    <button mat-raised-button color="primary" (click)="createChannel()">
      <mat-icon>add</mat-icon> Nuevo Canal
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando canales...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Channels Table -->
  <div class="table-container" *ngIf="!isLoading && channels.length > 0">
    <table mat-table [dataSource]="channels" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let channel">{{ channel.name }}</td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let channel">
          <mat-chip [color]="getTypeColor(channel.type)" selected>
            {{ getTypeLabel(channel.type) }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let channel">
          {{ channel.description || '-' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let channel">
          <button mat-icon-button color="primary" (click)="editChannel(channel)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(channel)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && channels.length === 0 && !errorMessage">
    <mat-icon class="empty-icon">campaign</mat-icon>
    <p>No hay canales de adquisición registrados</p>
    <button mat-raised-button color="primary" (click)="createChannel()">
      Crear primer canal
    </button>
  </div>
</div>
