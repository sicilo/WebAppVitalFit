<div class="room-type-list-container">
  <div class="page-header">
    <h1>Tipos de Sala</h1>
    <button mat-raised-button color="primary" (click)="createRoomType()">
      <mat-icon>add</mat-icon> Nuevo Tipo de Sala
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando tipos de sala...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Room Types Table -->
  <div class="table-container" *ngIf="!isLoading && roomTypes.length > 0">
    <table mat-table [dataSource]="roomTypes" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let roomType">{{ roomType.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let roomType">
          {{ roomType.description || '-' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let roomType">
          <button mat-icon-button color="primary" (click)="editRoomType(roomType)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(roomType)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && roomTypes.length === 0 && !errorMessage">
    <mat-icon>meeting_room</mat-icon>
    <h3>No hay tipos de sala registrados</h3>
    <button mat-raised-button color="primary" (click)="createRoomType()">
      Crear primer tipo de sala
    </button>
  </div>
</div>
