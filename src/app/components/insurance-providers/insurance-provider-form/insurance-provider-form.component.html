<h2 mat-dialog-title>{{ isEditMode ? 'Editar EPS/Aseguradora' : 'Crear EPS/Aseguradora' }}</h2>
<mat-dialog-content>
  <form [formGroup]="providerForm" class="insurance-provider-dialog-form">
    <mat-form-field>
      <mat-label>Nombre *</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Sanitas, Sura, Compensar">
      <mat-error *ngIf="providerForm.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="providerForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Código</mat-label>
      <input matInput formControlName="code" placeholder="Código de la EPS">
    </mat-form-field>

    <div class="form-row">
      <mat-form-field>
        <mat-label>Teléfono</mat-label>
        <input matInput formControlName="phone" placeholder="300 123 4567">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" placeholder="contacto@eps.com">
        <mat-error *ngIf="providerForm.get('email')?.hasError('email')">
          Email inválido
        </mat-error>
      </mat-form-field>
    </div>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Información adicional" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="providerForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
