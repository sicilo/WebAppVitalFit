<h2 mat-dialog-title>{{ isEditMode ? 'Editar Bono' : 'Crear Bono' }}</h2>
<mat-dialog-content>
  <form [formGroup]="bonusForm" class="bonus-dialog-form">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Bono 10 Sesiones">
      <mat-error *ngIf="bonusForm.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="bonusForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <div class="form-row">
      <mat-form-field>
        <mat-label>Sesiones (Opcional)</mat-label>
        <input matInput type="number" formControlName="sessions" placeholder="Ej: 10">
        <mat-error *ngIf="bonusForm.get('sessions')?.hasError('min')">
          Debe ser mayor a 0
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Precio (Opcional)</mat-label>
        <input matInput type="number" formControlName="price" placeholder="Ej: 150.00">
        <mat-error *ngIf="bonusForm.get('price')?.hasError('min')">
          Debe ser mayor o igual a 0
        </mat-error>
      </mat-form-field>
    </div>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Describe el bono" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="bonusForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
