<div class="bonus-list-container">
  <div class="page-header">
    <h1>Bonos</h1>
    <button mat-raised-button color="primary" (click)="createBonus()">
      <mat-icon>add</mat-icon> Nuevo Bono
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando bonos...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Bonuses Table -->
  <div class="table-container" *ngIf="!isLoading && bonuses.length > 0">
    <table mat-table [dataSource]="bonuses" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let bonus">{{ bonus.name }}</td>
      </ng-container>

      <!-- Sessions Column -->
      <ng-container matColumnDef="sessions">
        <th mat-header-cell *matHeaderCellDef>Sesiones</th>
        <td mat-cell *matCellDef="let bonus">
          <mat-chip color="accent" selected *ngIf="bonus.sessions">{{ bonus.sessions }}</mat-chip>
          <span *ngIf="!bonus.sessions">-</span>
        </td>
      </ng-container>

      <!-- Price Column -->
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let bonus">
          <strong *ngIf="bonus.price">{{ bonus.price | currency:'USD':'symbol':'1.2-2' }}</strong>
          <span *ngIf="!bonus.price">-</span>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let bonus">
          {{ bonus.description || '-' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let bonus">
          <button mat-icon-button color="primary" (click)="editBonus(bonus)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(bonus)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && bonuses.length === 0 && !errorMessage">
    <mat-icon>card_giftcard</mat-icon>
    <h3>No hay bonos registrados</h3>
    <button mat-raised-button color="primary" (click)="createBonus()">
      Crear primer bono
    </button>
  </div>
</div>
