<div class="skin-type-list-container">
  <div class="page-header">
    <h1>Tipos de Piel</h1>
    <button mat-raised-button color="primary" (click)="createSkinType()">
      <mat-icon>add</mat-icon> Nuevo Tipo de Piel
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando tipos de piel...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Skin Types Table -->
  <div class="table-container" *ngIf="!isLoading && skinTypes.length > 0">
    <table mat-table [dataSource]="skinTypes" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let skinType">{{ skinType.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let skinType">
          {{ skinType.description || '-' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let skinType">
          <button mat-icon-button color="primary" (click)="editSkinType(skinType)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(skinType)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && skinTypes.length === 0 && !errorMessage">
    <mat-icon class="empty-icon">face</mat-icon>
    <p>No hay tipos de piel registrados</p>
    <button mat-raised-button color="primary" (click)="createSkinType()">
      Crear primer tipo de piel
    </button>
  </div>
</div>
