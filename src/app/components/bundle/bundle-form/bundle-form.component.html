<h2 mat-dialog-title>{{ isEditMode ? 'Editar Paquete' : 'Crear Paquete' }}</h2>
<mat-dialog-content>
  <form [formGroup]="bundleForm" class="bundle-dialog-form">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Paquete Premium">
      <mat-error *ngIf="bundleForm.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="bundleForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price" placeholder="Ej: 250.00">
      <mat-error *ngIf="bundleForm.get('price')?.hasError('required')">
        El precio es requerido
      </mat-error>
      <mat-error *ngIf="bundleForm.get('price')?.hasError('min')">
        Debe ser mayor o igual a 0
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Describe el paquete" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="bundleForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
