<div class="employee-type-list-container">
  <div class="page-header">
    <h1>Tipos de Empleado</h1>
    <button mat-raised-button color="primary" (click)="createEmployeeType()">
      <mat-icon>add</mat-icon> Nuevo Tipo de Empleado
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando tipos de empleado...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Employee Types Table -->
  <div class="table-container" *ngIf="!isLoading && employeeTypes.length > 0">
    <table mat-table [dataSource]="employeeTypes" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let employeeType">{{ employeeType.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let employeeType">{{ employeeType.description }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let employeeType">
          <button mat-icon-button color="primary" (click)="editEmployeeType(employeeType)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(employeeType)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && employeeTypes.length === 0 && !errorMessage">
    <mat-icon>badge</mat-icon>
    <h3>No hay tipos de empleado registrados</h3>
    <button mat-raised-button color="primary" (click)="createEmployeeType()">
      Crear primer tipo de empleado
    </button>
  </div>
</div>
