<div class="job-title-list-container">
  <div class="page-header">
    <h1>Cargos</h1>
    <button mat-raised-button color="primary" (click)="createJobTitle()">
      <mat-icon>add</mat-icon> Nuevo Cargo
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando cargos...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Job Titles Table -->
  <div class="table-container" *ngIf="!isLoading && jobTitles.length > 0">
    <table mat-table [dataSource]="jobTitles" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let jobTitle">{{ jobTitle.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let jobTitle">{{ jobTitle.description || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let jobTitle">
          <button mat-icon-button color="primary" (click)="editJobTitle(jobTitle)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(jobTitle)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && jobTitles.length === 0 && !errorMessage">
    <mat-icon>work</mat-icon>
    <h3>No hay cargos registrados</h3>
    <button mat-raised-button color="primary" (click)="createJobTitle()">
      Crear primer cargo
    </button>
  </div>
</div>
