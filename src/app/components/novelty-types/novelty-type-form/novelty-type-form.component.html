<h2 mat-dialog-title>{{ isEditMode ? 'Editar Tipo de Novedad' : 'Crear Tipo de Novedad' }}</h2>
<mat-dialog-content>
  <form [formGroup]="noveltyTypeForm" class="novelty-type-dialog-form">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Hora Extra">
      <mat-error *ngIf="noveltyTypeForm.get('name')?.hasError('required')">
        El nombre es requerido
      </mat-error>
      <mat-error *ngIf="noveltyTypeForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Precio (Opcional)</mat-label>
      <input matInput type="number" formControlName="price" placeholder="Ej: 50.00">
      <mat-error *ngIf="noveltyTypeForm.get('price')?.hasError('min')">
        Debe ser mayor o igual a 0
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Describe el tipo de novedad" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="noveltyTypeForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
