<div class="provider-list-container">
  <div class="page-header">
    <h1>Proveedores</h1>
    <button mat-raised-button color="primary" (click)="createProvider()">
      <mat-icon>add</mat-icon> Nuevo Proveedor
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando proveedores...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Providers Table -->
  <div class="table-container" *ngIf="!isLoading && providers.length > 0">
    <table mat-table [dataSource]="providers" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let provider">{{ provider.name }}</td>
      </ng-container>

      <!-- NIT Column -->
      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef>NIT</th>
        <td mat-cell *matCellDef="let provider">{{ provider.nit || '-' }}</td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let provider">{{ provider.phone || '-' }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let provider">{{ provider.email || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let provider">
          <button mat-icon-button color="primary" (click)="editProvider(provider)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(provider)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && providers.length === 0 && !errorMessage">
    <mat-icon class="empty-icon">store</mat-icon>
    <p>No hay proveedores registrados</p>
    <button mat-raised-button color="primary" (click)="createProvider()">
      Crear primer proveedor
    </button>
  </div>
</div>
