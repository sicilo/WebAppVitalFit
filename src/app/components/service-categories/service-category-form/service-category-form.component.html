<h2 mat-dialog-title>{{ isEditMode ? 'Editar Categoría' : 'Crear Categoría de Servicio' }}</h2>
<mat-dialog-content>
  <form [formGroup]="categoryForm" class="category-dialog-form">
    <mat-form-field>
      <mat-label>Nombre de la Categoría</mat-label>
      <input matInput formControlName="name" placeholder="Ej: Tratamiento Anti-Edad">
      <mat-error *ngIf="categoryForm.get('name')?.hasError('required')">
        El nombre de la categoría es requerido
      </mat-error>
      <mat-error *ngIf="categoryForm.get('name')?.hasError('minlength')">
        Debe tener al menos 3 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tipo de Servicio</mat-label>
      <mat-select formControlName="type" placeholder="Selecciona un tipo">
        <mat-option *ngFor="let type of serviceTypes" [value]="type.value">
          {{ type.label }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="categoryForm.get('type')?.hasError('required')">
        El tipo de servicio es requerido
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Descripción (Opcional)</mat-label>
      <textarea matInput formControlName="description" placeholder="Describe el tipo de servicio" rows="3"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="categoryForm.invalid || isLoading">
    {{ isLoading ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Crear') }}
  </button>
</mat-dialog-actions>
