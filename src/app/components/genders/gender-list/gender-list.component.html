<div class="gender-list-container">
  <div class="page-header">
    <h1>Géneros</h1>
    <button mat-raised-button color="primary" (click)="createGender()">
      <mat-icon>add</mat-icon> Nuevo Género
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando géneros...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Genders Table -->
  <div class="table-container" *ngIf="!isLoading && genders.length > 0">
    <table mat-table [dataSource]="genders" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let gender">{{ gender.name }}</td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let gender">{{ gender.description || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let gender">
          <button mat-icon-button color="primary" (click)="editGender(gender)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(gender)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && genders.length === 0 && !errorMessage">
    <mat-icon>wc</mat-icon>
    <h3>No hay géneros registrados</h3>
    <button mat-raised-button color="primary" (click)="createGender()">
      Crear primer género
    </button>
  </div>
</div>
