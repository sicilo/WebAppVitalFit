<div class="employee-list-container">
  <div class="page-header">
    <h1>Empleados / Profesionales</h1>
    <button mat-raised-button color="primary" (click)="createEmployee()">
      <mat-icon>add</mat-icon> Nuevo Empleado
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>Cargando empleados...</p>
  </div>

  <!-- Error Message -->
  <div class="alert alert-error" *ngIf="errorMessage && !isLoading">
    {{ errorMessage }}
  </div>

  <!-- Employees Table -->
  <div class="table-container" *ngIf="!isLoading && employees.length > 0">
    <table mat-table [dataSource]="employees" class="mat-elevation-z2">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
        <td mat-cell *matCellDef="let employee">{{ getFullName(employee) }}</td>
      </ng-container>

      <!-- Role Column -->
      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let employee">
          <mat-chip [color]="getRoleColor(employee.role)" selected>
            {{ getRoleLabel(employee.role) }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Phone Column -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let employee">{{ employee.phone || '-' }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let employee">{{ employee.email || '-' }}</td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let employee">
          <button mat-icon-button color="primary" (click)="editEmployee(employee)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="confirmDelete(employee)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Empty State -->
  <div class="empty-state" *ngIf="!isLoading && employees.length === 0 && !errorMessage">
    <mat-icon class="empty-icon">groups</mat-icon>
    <p>No hay empleados registrados</p>
    <button mat-raised-button color="primary" (click)="createEmployee()">
      Crear primer empleado
    </button>
  </div>
</div>
